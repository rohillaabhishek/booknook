<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookNook Hotel</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KyZXEJx3WLwD37B1pDLrmZ7F3bs3z2M9b5VZg3D15wDjcV5S/t0P4r8S8KlN6DRe" crossorigin="anonymous">

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- Google Fonts (Poppins for Zomato-style) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

  <style>
    /* Global Styles */
body {
  margin: 0;
  font-family: 'Arial', sans-serif;
  background-size: cover;
  background-position: center;
  color: #fff;
  min-height: 100vh; /* Ensure the page takes at least full viewport height */
  display: flex;
  flex-direction: column; /* Stack content and footer vertically */
  justify-content: flex-start; /* Ensure content is aligned at the top */
}



/* Hero Section */
.hero-section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: url('./public/img.jpg') no-repeat center center/cover; /* Set the background image */
}

.hero-section h1 {
  font-size: 4rem;
  font-weight: 600;
}

.hero-section p {
  font-size: 1.5rem;
}

.hero-section button {
  margin-top: 20px;
  padding: 12px 30px;
  font-size: 1.2rem;
  background-color: #007bff;
  border: none;
  color: white;
  border-radius: 5px;
  transition: background-color 0.3s ease;
}
.hero-section button:hover{
    background-color: #0056b3;
    box-shadow: 0px 20px 40px rgba(0, 0, 0, 0.2);
}



/* Room Section */
.room-section {
  padding: 50px 0;
  background-color: rgba(255, 255, 255, 0.9);
  color: #333;
}

.room-section h2 {
  text-align: center;
  margin-bottom: 40px;
  font-size: 2.5rem;
  font-weight: 600;
}

/* Card Styles */
.card {
  border-radius: 10px;
  box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.1);
  margin: 20px;
  overflow: hidden;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card img.card-img-top {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.card-body {
  padding: 15px;
}

.card-title {
  font-size: 1.6rem;
  font-weight: 500;
}

.card-text {
  font-size: 1.2rem;
  margin-bottom: 15px;
}

/* Hover Effect */
.card:hover {
  transform: translateY(-10px);
  box-shadow: 0px 20px 40px rgba(0, 0, 0, 0.2);
}

/* Button Style */
.btn-view-details {
  background-color: #007bff;
  color: white;
  border-radius: 5px;
  font-size: 1.1rem;
  padding: 10px 20px;
  border: none;
  transition: background-color 0.3s ease, transform 0.3s ease;
}

.btn-view-details:hover {
  background-color: #0056b3;
  transform: scale(1.05);
}

/* Table Styles */
table {
  width: 100%;
  margin: 0 auto;
  border-spacing: 30px;
}

td {
  width: 33.33%;
  text-align: center;
  vertical-align: top;
}

/* Footer Styles */
.footer {
  background-color: #3d3d3d; /* Solid white footer */
  text-align: center;
  padding: 20px;
  width: 100%;
  font-size: 1rem;
  color: #ffffff;
  position: relative;
  bottom: 0;
  margin-top: auto; /* Push footer to the bottom */
}

  </style>
</head>
<body>



  <!-- Hero Section -->
  <section class="hero-section">
    <div>
      <h1>Welcome to BookNook Hotel</h1>
      <p>Your luxurious getaway awaits</p>
      <button class="btn btn-light">Book Now</button>
    </div>
  </section>

  <!-- Rooms Section -->
  <section class="room-section">
    <h2>Our Rooms</h2>
    <div class="container">
      <table>
        <tr>
          <!-- Room 1 Card -->
          <td>
            <div class="card">
              <img src="./public/room1.jpg" class="card-img-top" alt="Room 1">
              <div class="card-body">
                <h5 class="card-title">Deluxe Room</h5>
                <p class="card-text">A luxurious room with all modern amenities.</p>
                <button class="btn-view-details">View Details</button>
              </div>
            </div>
          </td>

          <!-- Room 2 Card -->
          <td>
            <div class="card">
              <img src="./public/room2.jpg" class="card-img-top" alt="Room 2">
              <div class="card-body">
                <h5 class="card-title">Standard Room</h5>
                <p class="card-text">A comfortable and cozy room for your stay.</p>
                <button class="btn-view-details">View Details</button>
              </div>
            </div>
          </td>

          <!-- Room 3 Card -->
          <td>
            <div class="card">
              <img src="./public/room3.jpg" class="card-img-top" alt="Room 3">
              <div class="card-body">
                <h5 class="card-title">Suite</h5>
                <p class="card-text">An elegant suite for a lavish experience.</p>
                <button class="btn-view-details">View Details</button>
              </div>
            </div>
          </td>
        </tr>
      </table>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2024 BookNook Hotel. All rights reserved.</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-pzjw8f+ua7Kw1TIq0YrOe9MoH0Uw28H2MdxgHR8Wn5Yy6PfZ2+/42PqT75eR15v0" crossorigin="anonymous"></script>
  
  <!-- jQuery Script -->
  <script>
    window.watsonAssistantChatOptions = {
      integrationID: "6df6f929-c6e8-4a19-95c5-8d04553af51f", // The ID of this integration.
      region: "au-syd", // The region your integration is hosted in.
      serviceInstanceID: "65d711e1-e9ae-4212-9f20-7093ffa9ba72", // The ID of your service instance.
      onLoad: async (instance) => { await instance.render(); }
    };
    setTimeout(function(){
      const t=document.createElement('script');
      t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" + (window.watsonAssistantChatOptions.clientVersion || 'latest') + "/WatsonAssistantChatEntry.js";
      document.head.appendChild(t);
    });
  </script>
  <script>
    $(document).ready(function() {
      $('.btn-light').click(function() {
        alert('Booking functionality will be implemented soon!');
      });
    });
  </script>

</body>
</html>
